<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is the world at peace today?</title>
    <meta property="og:title" content="Is the world at peace today?">
    <meta property="og:description" content="Find out if humanity has achieved world peace.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.03;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        main {
            text-align: center;
            padding: clamp(2rem, 5vw, 4rem);
            max-width: 100vw;
            overflow: hidden;
        }

        .question {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.5rem, 4vw, 3rem);
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: #e0e0e0;
            margin-bottom: clamp(1rem, 3vw, 2rem);
        }

        .answer {
            font-family: 'Playfair Display', serif;
            font-size: clamp(8rem, 25vw, 20rem);
            font-weight: 900;
            color: #c23616;
            text-shadow: 0 0 40px rgba(194, 54, 22, 0.3);
            text-align: center;
            line-height: 1;
            letter-spacing: -0.02em;
            margin: clamp(0.5rem, 2vw, 1rem) 0;
            animation: fadeIn 1.5s ease-out;
        }

        .answer.peace {
            color: #27ae60;
            text-shadow: 0 0 40px rgba(39, 174, 96, 0.3);
        }

        .counter {
            font-family: 'DM Mono', monospace;
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            color: #666;
            margin-top: clamp(0.5rem, 1.5vw, 1rem);
            letter-spacing: 0.02em;
        }

        .meta {
            font-family: 'DM Mono', monospace;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            color: #555;
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .divider {
            border: none;
            border-top: 1px solid #333;
            max-width: 200px;
            margin: clamp(1.5rem, 3vw, 2.5rem) auto;
        }

        .inscription {
            font-family: 'DM Mono', monospace;
            font-size: clamp(0.7rem, 1.1vw, 0.85rem);
            color: #444;
            line-height: 1.7;
            letter-spacing: 0.01em;
            animation: fadeIn 1s ease-out 1s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(1.02);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 class="question">Is the world at peace today?</h1>
        <div id="answer" class="answer">...</div>
        <p id="counter" class="counter"></p>
        <p id="meta" class="meta"></p>
        <hr class="divider">
        <p class="inscription">
            If this page ever shows YES,<br>
            humanity achieved something remarkable.
        </p>
    </main>
    <script>
        fetch("status.json")
            .then(r => r.json())
            .then(data => {
                const answer = document.getElementById("answer");
                answer.textContent = data.peace ? "YES" : "NO";
                if (data.peace) answer.classList.add("peace");

                document.getElementById("counter").textContent =
                    `Day ${data.day_counter.toLocaleString()} of asking.`;

                document.getElementById("meta").textContent =
                    `${data.total} active conflicts \u00b7 ${data.date}`;
            });
    </script>
</body>
</html>
